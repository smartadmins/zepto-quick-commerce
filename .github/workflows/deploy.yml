apiVersion: apps/v1
kind: Deployment
metadata:
  name: zepto-backend
  namespace: zepto
  labels:
    app: zepto-backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: zepto-backend

  template:
    metadata:
      labels:
        app: zepto-backend

    spec:
      containers:
        - name: backend
          image: us-east1-docker.pkg.dev/zepto-ecommerce-app-506504/zepto-repo/zepto-backend:latest

          ports:
            - containerPort: 5000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
