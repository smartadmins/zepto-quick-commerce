name: Zepto Quick Commerce CI/CD

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Replace these values with your actual GCP project details
  PROJECT_ID: "165290163749"  # e.g., "zepto-commerce-123456"
  GAR_LOCATION: "us-east1"  # e.g., "us-central1", "europe-west1"
  GAR_REPOSITORY: "zepto-repo"  # Your Artifact Registry repository name
  GKE_CLUSTER: "zepto-gke-cluster"  # Your GKE cluster name
  GKE_LOCATION: "us-east1"  # Your GKE cluster location
  K8S_NAMESPACE: "zepto"  # Your Kubernetes namespace

jobs:

  # ==========================================
  # JOB 1: TEST APPLICATION
  # ==========================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Check Backend Application
        working-directory: backend
        run: node --check server.js

  # ==========================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ==========================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          # IMPORTANT: Use PROJECT NUMBER (not project ID) in the provider path
          # Format: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: "projects/123456789012/locations/global/workloadIdentityPools/zepto-pool/providers/zepto-provider"
          service_account: "zepto-sa@your-gcp-project-id.iam.gserviceaccount.com"

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }} \
            ./frontend

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }} \
            ./backend

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }}

      - name: Push Backend Image
        run: |
          docker push \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }}

  # ==========================================
  # JOB 3: DEPLOY TO GKE
  # ==========================================

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: "projects/123456789012/locations/global/workloadIdentityPools/zepto-pool/providers/zepto-provider"
          service_account: "zepto-sa@your-gcp-project-id.iam.gserviceaccount.com"

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update Backend Image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-backend \
            backend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }}

      - name: Update Frontend Image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-frontend \
            frontend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }}

      - name: Verify Backend Deployment
        run: |
          kubectl rollout status \
            deployment/zepto-backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Verify Frontend Deployment
        run: |
          kubectl rollout status \
            deployment/zepto-frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Verify Kubernetes Resources
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}
