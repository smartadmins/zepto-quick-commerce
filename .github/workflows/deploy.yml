name: Zepto Quick Commerce CI/CD

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ==========================================================
  # JOB 1: TEST APPLICATION
  # ==========================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Frontend Testing
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint || echo "No lint script found"

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Test Frontend
        working-directory: frontend
        run: npm test || echo "No test script found"

      # Backend Testing
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Lint Backend
        working-directory: backend
        run: npm run lint || echo "No lint script found"

      - name: Check Backend Syntax
        working-directory: backend
        run: node --check server.js

      - name: Test Backend
        working-directory: backend
        run: npm test || echo "No test script found"

  # ==========================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ==========================================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    
    # Only build on main branch or when manually triggered
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY || 'dummy' }}
        continue-on-error: true

      # Use Docker Buildx for better caching
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ github.ref_name }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ github.ref_name }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # JOB 3: DEPLOY TO GKE
  # ==========================================================

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    
    # Deploy only on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Kubernetes Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create Namespace if not exists
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Backend
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-backend \
            backend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ github.sha }} \
            --record

      - name: Deploy Frontend
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-frontend \
            frontend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ github.sha }} \
            --record

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status \
            deployment/zepto-backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status \
            deployment/zepto-frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Verify Deployments
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

      - name: Display Deployed Images
        run: |
          echo "Deployed Images:"
          echo "Backend: $(kubectl get deployment zepto-backend -n ${{ env.K8S_NAMESPACE }} -o=jsonpath='{.spec.template.spec.containers[*].image}')"
          echo "Frontend: $(kubectl get deployment zepto-frontend -n ${{ env.K8S_NAMESPACE }} -o=jsonpath='{.spec.template.spec.containers[*].image}')"

  # ==========================================================
  # JOB 4: ROLLBACK (Optional)
  # ==========================================================

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Rollback Backend
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout undo deployment/zepto-backend

      - name: Rollback Frontend
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout undo deployment/zepto-frontend

      - name: Verify Rollback
        run: |
          kubectl rollout status kubernetes/backend -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl rollout status kubernetes/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=180s
