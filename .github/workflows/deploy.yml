name: Zepto Quick Commerce CI/CD

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:

  # ==========================================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGES
  # ==========================================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }} \
            ./frontend

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }} \
            ./backend

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }}

      - name: Push Backend Image
        run: |
          docker push \
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }}

  # ==========================================================
  # JOB 2: DEPLOY TO GKE
  # ==========================================================

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Create Namespace if not exists
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Backend Image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-backend \
            backend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-backend:${{ env.IMAGE_TAG }}

      - name: Update Frontend Image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/zepto-frontend \
            frontend=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/zepto-frontend:${{ env.IMAGE_TAG }}

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status \
            deployment/zepto-backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status \
            deployment/zepto-frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: Verify Deployments
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

      - name: Display Deployed Images
        run: |
          echo "Deployed Images:"
          echo "Backend: $(kubectl get deployment zepto-backend -n ${{ env.K8S_NAMESPACE }} -o=jsonpath='{.spec.template.spec.containers[*].image}')"
          echo "Frontend: $(kubectl get deployment zepto-frontend -n ${{ env.K8S_NAMESPACE }} -o=jsonpath='{.spec.template.spec.containers[*].image}')"

  # ==========================================================
  # JOB 3: ROLLBACK ON FAILURE (Optional)
  # ==========================================================

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Rollback Backend
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout undo deployment/zepto-backend

      - name: Rollback Frontend
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout undo deployment/zepto-frontend

      - name: Verify Rollback
        run: |
          kubectl rollout status deployment/zepto-backend -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/zepto-frontend -n ${{ env.K8S_NAMESPACE }} --timeout=180s
